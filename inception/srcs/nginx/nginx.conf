server {
    # 1. SSL/HTTPS Configuration
    listen 443 ssl;
    listen [::]:443 ssl;

    # The subject strictly requires TLSv1.2 or TLSv1.3
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # These paths must match where you put the generated certificates in your Dockerfile
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # 2. Server Name and Root Directory
    server_name sjouan.42.fr;
    root /var/www/html;
    
    # Tells NGINX which files to look for when a user visits the domain
    index index.php index.html index.htm;

    # 3. Default Routing Rule
    location / {
        # If the requested file or folder doesn't exist, return a 404 error
        try_files $uri $uri/ =404;
    }

    # 4. FastCGI Routing (The WordPress Connection)
    location ~ \.php$ {
        # Splits the requested URI to isolate the PHP script
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Forwards the request to the wordpress container on port 9000
        fastcgi_pass wordpress:9000;
        
        fastcgi_index index.php;
        
        # Includes standard FastCGI variables
        include fastcgi_params;
        
        # Tells the WordPress container exactly where the script is located in its own file system
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}